version: "3.8"

services:
  whatsappapi:
    image: whatsappapi:latest
    networks:
      - network_public
    environment:
      - WUZAPI_ADMIN_TOKEN
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
      - DB_HOST
      - DB_PORT
      - TZ
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.http.routers.whatsappapi.rule=Host(`whatsappapi.cervantes.dev.br`)
        - traefik.http.routers.whatsappapi.entrypoints=websecure
        - traefik.http.routers.whatsappapi.tls.certresolver=letsencryptresolver
        - traefik.http.services.whatsappapi.loadbalancer.server.port=5000

networks:
  network_public:
    external: true